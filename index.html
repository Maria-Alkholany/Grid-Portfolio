<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .containr {
            display: grid;
            grid-template-columns: 50px 100px 150px 200px 200px 50px 50px;
            grid-template-rows: 50px 70px 60px 150px 140px 90px 50px 50px 50px;
            background-color: black;
            gap: 5px;
        }

        .black1 {
            background-color: black;
            grid-row: 1/4;
            grid-column: 1/1;
        }

        .gray1 {
            background-color: rgb(235, 231, 231);
            grid-row: 1;
            grid-column: 2/4;
        }

        .red1 {
            background-color: red;
            grid-row: 2/4;
            grid-column: 2/3;
        }

        .white1 {
            background-color: whitesmoke;
            grid-row: 2/4;
            grid-column: 3/4;
        }

        .white2 {
            background-color: whitesmoke;
            grid-row: 1/3;
            grid-column: 4/5;
        }

        .yellow1 {
            background-color: yellow;
            grid-row: 3/4;
            grid-column: 4/5;
        }

        .gray2 {
            background-color: rgb(235, 231, 231);
            ;
            grid-row: 1/3;
            grid-column: 5/6;
        }

        .blue1 {
            background-color: blue;
            grid-row: 3/4;
            grid-column: 5/6;
        }

        .yellow2 {
            background-color: yellow;
            grid-row: 1/4;
            grid-column: 6/8;
        }

        .white3 {
            background-color: whitesmoke;
            grid-row: 4/6;
            grid-column: 1;
        }

        .blue2 {
            background-color: blue;
            grid-row: 4/4;
            grid-column: 2/4;
        }

        .black2 {
            background-color: black;
            grid-row: 5/6;
            grid-column: 2/4;
        }

        .yellow3 {
            background-color: yellow;
            grid-row: 4/4;
            grid-column: 4/5;
        }

        .white4 {
            background-color: whitesmoke;
            grid-column: 4/5;
            grid-row: 5/6;
        }

        .gray3 {
            background-color: rgb(235, 231, 231);
            ;
            grid-row: 4/5;
            grid-column: 5/6;
        }

        .black3 {
            background-color: black;
            grid-row: 5/7;
            grid-column: 5/6;
        }

        .red2 {
            background-color: red;
            grid-row: 4/7;
            grid-column: 6/7;
        }

        .white5 {
            background-color: whitesmoke;
            grid-row: 4/7;
            grid-column: 7/8;
        }

        .gray4 {
            background-color: rgb(235, 231, 231);
            grid-row: 6/8;
            grid-column: 1/3;
        }

        .white6 {
            background-color: whitesmoke;
            grid-row: 8/10;
            grid-column: 1/3;
        }

        .red3 {
            background-color: red;
            grid-row: 6/9;
            grid-column: 3/4;
        }

        .black4 {
            background-color: black;
            grid-row: 9/10;
            grid-column: 3/5;
        }

        .white7 {
            background-color: whitesmoke;
            grid-row: 6/7;
            grid-column: 4/5;
        }

        .blue3{
            background-color: blue;
            grid-row: 9/7;
            grid-column:4/5 ;
        }

        .yellow4{
            background-color: yellow;
            grid-row: 7/9;
            grid-column: 5/6;
        }

        .gray5{
            background-color:  rgb(235, 231, 231);
            grid-row: 9/10;
            grid-column: 5/6;
        }

        .white8{
            background-color: whitesmoke;
            grid-row: 7/10;
            grid-column: 6/8;
        }
    </style>
</head>

<body>
    <div class="containr">
        <div class="black black1"></div>
        <div class="gray gray1"></div>
        <div class="red red1"></div>
        <div class="white white1"></div>
        <div class="white white2"></div>
        <div class="yellow yellow1"></div>
        <div class="gray gray2"></div>
        <div class="blue1"></div>
        <div class="yellow yellow2"></div>
        <div class="white white3"></div>

        <div class="black black2"></div>
        <div class="yellow yellow3"></div>

        <div class="red red2"></div>
        <div class="white white5"></div>

        <div class="black black4"></div>

</body>

</html>
